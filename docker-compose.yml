services:
  postgres:
    image: postgres:17
    profiles: [db, backend, nginx, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrate:
    build: ./db
    profiles: [db, backend, nginx, full]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}

  redis:
    image: redis:7
    profiles: [db, backend, nginx, full]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
