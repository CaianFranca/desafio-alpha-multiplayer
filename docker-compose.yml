services:
  postgres:
    image: postgres:17
    profiles: [db, backend, nginx, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrate:
    build: ./db
    profiles: [db, backend, nginx, full]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}

  redis:
    image: redis:7
    profiles: [db, backend, nginx, full]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  lobby-server:
    build:
      context: .
      dockerfile: ./backend/lobby-server/Dockerfile
      args:
        LOBBY_SERVER_PORT: ${LOBBY_SERVER_PORT:-3001}
    profiles: [backend, nginx, full]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "${LOBBY_SERVER_PORT:-3001}:${LOBBY_SERVER_PORT:-3001}"
    volumes:
      - ./backend/lobby-server:/app/backend/lobby-server
      - ./packages/config:/app/packages/config
      - ./packages/shared:/app/packages/shared
      - ./packages/engine:/app/packages/engine
      - /app/node_modules
      - /app/backend/lobby-server/node_modules
    working_dir: /app/backend/lobby-server
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOBBY_SERVER_PORT: ${LOBBY_SERVER_PORT:-3001}
      LOBBY_PUBLIC_URL: ${LOBBY_PUBLIC_URL:-http://localhost:${NGINX_PORT:-8080}}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_change_me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_ACCESS_TTL_SECONDS: ${SESSION_ACCESS_TTL_SECONDS:-900}
      SESSION_REFRESH_TTL_SECONDS: ${SESSION_REFRESH_TTL_SECONDS:-604800}
      NODE_ENV: ${NODE_ENV:-development}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.LOBBY_SERVER_PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  game-server:
    build:
      context: .
      dockerfile: ./backend/game-server/Dockerfile
      args:
        GAME_SERVER_PORT: ${GAME_SERVER_PORT:-1234}
    profiles: [backend, nginx, full]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "${GAME_SERVER_PORT:-1234}:${GAME_SERVER_PORT:-1234}"
    volumes:
      - ./backend/game-server:/app/backend/game-server
      - ./packages/config:/app/packages/config
      - ./packages/shared:/app/packages/shared
      - ./packages/engine:/app/packages/engine
      - /app/node_modules
      - /app/backend/game-server/node_modules
    working_dir: /app/backend/game-server
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GAME_SERVER_PORT: ${GAME_SERVER_PORT:-1234}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      PARTIDA_TERMINADA_TTL_SEGUNDOS: ${PARTIDA_TERMINADA_TTL_SEGUNDOS:-3600}
      PARTIDA_ABANDONO_SEGUNDOS: ${PARTIDA_ABANDONO_SEGUNDOS:-90}
      LOBBY_RETORNO_CALLBACK_URL: ${LOBBY_RETORNO_CALLBACK_URL:-http://lobby-server:3001/api/retorno}
      NODE_ENV: ${NODE_ENV:-development}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.GAME_SERVER_PORT||1234)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    profiles: [nginx, full]
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      lobby-server:
        condition: service_healthy
      game-server:
        condition: service_healthy
    volumes:
      - ./frontend/web/media:/usr/share/nginx/html/media:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
