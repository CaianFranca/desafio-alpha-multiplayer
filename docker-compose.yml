services:
  postgres:
    image: postgres:17
    profiles: [db, backend, nginx, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    profiles: [db, backend, nginx, full]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    profiles: [nginx, full]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/web/media:/usr/share/nginx/html/media:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
