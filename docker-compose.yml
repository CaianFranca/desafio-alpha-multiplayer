services:
  postgres:
    image: postgres:17
    profiles: [db, backend, nginx, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flicker}
      POSTGRES_USER: ${POSTGRES_USER:-flicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flicker_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    profiles: [db, backend, nginx, full]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:alpine
    profiles: [nginx, full]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/web/dist:/usr/share/nginx/html:ro
      - ./frontend/web/media:/usr/share/nginx/html/media:ro

volumes:
  postgres_data:
