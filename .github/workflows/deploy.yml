# Deploy — Flicker of Sanity (Fase 2: quality gates + artefato tarball)
#
# Dispara em push na branch `prod` ou manualmente (workflow_dispatch com SHA
# curto opcional para rollback). O job `quality` roda typecheck + migrations
# em banco limpo; o job `build` empacota o artefato de release (tarball) como
# artifact baixável.
#
# Decisão: NENHUM teste roda no CI — suíte (integração e frontend) não
# mantida pelo time e validada localmente antes do merge; testes de frontend
# se mostraram flaky no runner do Actions (decisão de 2026-09-05).
#
# Fase 3 adicionará o job de deploy (scp + systemd + nginx + GitHub Release).

name: Deploy — Flicker of Sanity

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA curto para build (rollback); vazio = HEAD da branch
        required: false
        default: ''

permissions:
  contents: read   # Fase 3 muda p/ write (GitHub Release)

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (typecheck + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Nomes derivados do código (packages/config, db/knexfile.ts).
      # Valores de teste — nenhum secret real.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: flicker
      POSTGRES_PASSWORD: flicker_ci_password
      POSTGRES_DB: flicker
      # knexfile escolhe a config por NODE_ENV (default: development).
      NODE_ENV: development

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flicker
          POSTGRES_PASSWORD: flicker_ci_password
          POSTGRES_DB: flicker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flicker -d flicker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Typecheck (workspaces)
        run: npm ci && npm run typecheck

      - name: Migrations (db não é workspace da raiz)
        working-directory: db
        run: npm ci && npx knex migrate:latest --knexfile knexfile.ts

  build:
    name: Build do artefato de release (tarball)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolver SHA curto (nome do tarball/artifact)
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build do release
        run: scripts/build-release.sh "$SHORT_SHA"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: flicker-${{ env.SHORT_SHA }}
          path: release/flicker-${{ env.SHORT_SHA }}.tar.gz
          retention-days: 14
