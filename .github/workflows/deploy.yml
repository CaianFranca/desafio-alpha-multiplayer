# Deploy — Flicker of Sanity (Fase 2: quality gates + artefato tarball)
#
# Dispara em push na branch `prod` ou manualmente (workflow_dispatch com SHA
# curto opcional para rollback). O job `quality` roda typecheck + testes de
# integração reais (Postgres 17 + Redis 7) + testes do frontend; o job `build`
# empacota o artefato de release (tarball) como artifact baixável.
#
# Fase 3 adicionará o job de deploy (scp + systemd + nginx + GitHub Release).

name: Deploy — Flicker of Sanity

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA curto para build (rollback); vazio = HEAD da branch
        required: false
        default: ''

permissions:
  contents: read   # Fase 3 muda p/ write (GitHub Release)

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (typecheck + integração + frontend)
    runs-on: ubuntu-latest

    env:
      # Nomes derivados do código (packages/config, db/knexfile.ts, testes de
      # integração). Valores de teste — nenhum secret real.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: flicker
      POSTGRES_PASSWORD: flicker_ci_password
      POSTGRES_DB: flicker
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      JWT_SECRET: ci_jwt_secret_apenas_para_testes
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_apenas_para_testes
      LOBBY_PUBLIC_URL: http://localhost:3001
      # knexfile escolhe a config por NODE_ENV (default: development).
      # Testes que exigem 'production' setam a env nos próprios before().
      NODE_ENV: development

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flicker
          POSTGRES_PASSWORD: flicker_ci_password
          POSTGRES_DB: flicker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flicker -d flicker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Typecheck (workspaces)
        run: npm ci && npm run typecheck

      - name: Migrations (db não é workspace da raiz)
        working-directory: db
        run: npm ci && npx knex migrate:latest --knexfile knexfile.ts

      - name: Testes de integração (lobby + game)
        run: npm run test:all

      - name: Testes do frontend
        working-directory: frontend
        run: npm ci && npx vitest run

  build:
    name: Build do artefato de release (tarball)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolver SHA curto (nome do tarball/artifact)
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build do release
        run: scripts/build-release.sh "$SHORT_SHA"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: flicker-${{ env.SHORT_SHA }}
          path: release/flicker-${{ env.SHORT_SHA }}.tar.gz
          retention-days: 14
