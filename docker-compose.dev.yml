# docker-compose.dev.yml — override do modo dev com hot-reload.
# Uso:
#   COMPOSE_PROFILES=dev docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# O modo full (`docker compose up -d`, sem este arquivo) continua servindo
# o build estático via infra/nginx/nginx.conf — este arquivo não o altera.
#
# O que muda em relação ao base:
# - novo serviço frontend-dev (Vite HMR em :5173, bind-mount do source);
# - nginx passa a servir infra/nginx/nginx.dev.conf (proxy / -> frontend-dev,
#   restante do routing idêntico) e aguarda o frontend-dev;
# - lobby-server/game-server ganham polling de file-watch (bind-mounts no
#   Windows/Docker Desktop não propagam inotify de forma confiável);
# - todos os serviços necessários ganham o profile `dev` (listas de profiles
#   restadas por extenso: o merge de override substitui sequências).
services:
  postgres:
    profiles: [db, backend, nginx, full, dev]

  db-migrate:
    profiles: [db, backend, nginx, full, dev]

  redis:
    profiles: [db, backend, nginx, full, dev]

  lobby-server:
    profiles: [backend, nginx, full, dev]
    environment:
      # tsx watch / chokidar atrás de bind-mount Windows: polling em vez de inotify.
      # As duas grafias cobrem chokidar v3 (USEPOLLING) e guias que usam underscore.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_USE_POLLING: "true"
      CHOKIDAR_INTERVAL: "300"

  game-server:
    profiles: [backend, nginx, full, dev]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_USE_POLLING: "true"
      CHOKIDAR_INTERVAL: "300"

  frontend-dev:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    profiles: [dev]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./packages/shared:/app/packages/shared
      - /app/frontend/node_modules
    working_dir: /app/frontend
    environment:
      LOBBY_SERVER_PORT: ${LOBBY_SERVER_PORT:-3001}
      # Proxy /api do Vite mira o service name dentro da rede do Compose.
      VITE_DEV_PROXY_LOBBY: http://lobby-server:${LOBBY_SERVER_PORT:-3001}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_USE_POLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/@vite/client').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    profiles: [nginx, full, dev]
    depends_on:
      frontend-dev:
        condition: service_started
    volumes:
      - ./frontend/web/media:/usr/share/nginx/html/media:ro
      # Sombreia o default.conf assado na imagem (nginx.conf) pelo de dev.
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
