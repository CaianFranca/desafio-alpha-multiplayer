map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream lobby_server {
    server lobby-server:3001;
}

upstream game_servers {
    server game-server:1234;
    # futuras instâncias: não adicionar server estático aqui; descoberta via registro Redis com heartbeat/lease (ADR-0003)
}

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    location /media/ {
        alias /usr/share/nginx/html/media/;
        try_files $uri =404;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://lobby_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/lobby {
        proxy_pass http://lobby_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ~ ^/ws/game/ {
        proxy_pass http://game_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
