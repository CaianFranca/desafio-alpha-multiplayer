events {}
http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /media/ {
            alias /usr/share/nginx/html/media/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
