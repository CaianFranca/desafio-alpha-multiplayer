# nginx.edge.conf — vhost de borda do Flicker of Sanity para o subpath
# público /server01, exposto por um Cloudflare Quick Tunnel efêmero.
#
# Instalado pelo deploy-server.sh em
# /etc/nginx/sites-available/flicker-edge (symlink em sites-enabled/).
# Este arquivo é incluído dentro do `http {}` do nginx (sites-enabled/*), por
# isso o `map` abaixo (contexto http) é válido.
#
# O Cloudflare Quick Tunnel termina o TLS; o cloudflared conecta a este host no
# loopback (127.0.0.1) na porta 80, preservando o prefixo /server01 (o SPA
# referencia /server01/assets/...). Como o Host que chega não casa com um
# server_name nomeado, este vhost é o `default_server` de :80.
# A barra final em `proxy_pass http://127.0.0.1:8080/` substitui a parte do URI
# que casa com a location (`/server01/`) por `/`, removendo o prefixo antes de
# entregar ao nginx do app — caminho normal do Quick Tunnel (prefixo preservado).
# Na pass-through da raiz (`location /`) a barra final também faz o nginx usar
# o URI normalizado (merge_slashes, default on), colapsando barras repetidas:
# um proxy a montante pode entregar `//api/...` e o app recebe `/api/...`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Se o salto anterior não enviar X-Forwarded-Proto, assume HTTPS: o TLS é
# terminado no Cloudflare e este salto interno é sempre http, então o
# fallback seguro para cookies Secure/redirects é `https`.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# Zonas de rate limit por IP (limit_req_zone/limit_conn_zone) + map do escopo,
# em contexto http. Ponto único em rate-limit.snippet — instalado pelo deploy
# em /etc/nginx/conf.d/ (extensão .snippet, fora do auto-include conf.d/*.conf).
include /etc/nginx/conf.d/rate-limit.snippet;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Borda também é produção (default_server em :80): não expor a versão
    # do nginx nas respostas geradas por este vhost (301 de /server01,
    # 404 do default_server, 502 de upstream). Critério #415.
    server_tokens off;

    # Restaura o IP real do cliente (CF-Connecting-IP) quando a requisição
    # chega pelo Cloudflare Quick Tunnel. No server (não no http) para não
    # alterar o $remote_addr do vhost do app, que vive no mesmo nginx.
    include /etc/nginx/conf.d/cloudflare-realip.snippet;

    # Tetos de borda (#418): corpo máximo por requisição e conexões por IP.
    # O teto de conexões é por IP e NÃO conta estáticos (assets/media — o
    # escopo via map está em rate-limit.snippet); o WebSocket continua
    # contando, por ser conexão longa. O 503 é o default do limit_conn_status.
    client_max_body_size 256k;
    limit_conn perip_conn 50;

    # Rate limit por IP no /api/ e no handshake WS (escopo via map em
    # rate-limit.snippet). Assets do SPA não entram (chave vazia).
    limit_req zone=perip_req burst=20 nodelay;
    limit_req_status 429;

    # Redirects relativos: o host externo pertence ao Cloudflare Quick Tunnel;
    # gerar uma URL absoluta com o Host interno quebraria o redirect de
    # /server01.
    absolute_redirect off;

    # /server01 (sem barra) → /server01/.
    location = /server01 {
        return 301 /server01/;
    }

    # Strip do prefixo: /server01/<resto> → /<resto> em 127.0.0.1:8080.
    location /server01/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    # Pass-through: fallback para quando o prefixo /server01 chega removido por
    # um proxy a montante e a requisição cai na raiz. A barra final em
    # `proxy_pass .../` faz o nginx usar o URI NORMALIZADO (merge_slashes,
    # default on): o `/` casado é substituído por `/` e barras repetidas viram
    # uma só — um proxy pode entregar `//api/...`, que chega ao nginx do app
    # como `/api/...`. No caminho normal do Quick Tunnel (prefixo preservado),
    # a location /server01/ (mais específica) vence e faz o strip.
    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }
}
