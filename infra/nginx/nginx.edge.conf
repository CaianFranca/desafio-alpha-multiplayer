# nginx.edge.conf — vhost de borda do Flicker of Sanity para o subpath
# público https://lab.alphaedtech.org.br/server01.
#
# Instalado pelo deploy-server.sh em
# /etc/nginx/sites-available/flicker-edge (symlink em sites-enabled/).
# Este arquivo é incluído dentro do `http {}` do nginx (sites-enabled/*), por
# isso o `map` abaixo (contexto http) é válido.
#
# O proxy do admin termina o TLS e PRESERVA o prefixo /server01 ao encaminhar
# para este host na porta 80. Como o admin envia Host interno/privado, o
# server_name não casa: por isso este vhost é o `default_server` de :80.
# A barra final em `proxy_pass http://127.0.0.1:8080/` substitui a parte do URI
# que casa com a location (`/server01/`) por `/`, removendo o prefixo antes de
# entregar ao nginx do app.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Se o proxy do admin não enviar X-Forwarded-Proto, assume HTTPS: o TLS é
# terminado na borda do admin e este salto interno é sempre http, então o
# fallback seguro para cookies Secure/redirects é `https`.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirects relativos: o host externo (lab.alphaedtech.org.br) pertence ao
    # proxy do admin; gerar uma URL absoluta com o Host interno quebraria o
    # redirect de /server01.
    absolute_redirect off;

    # /server01 (sem barra) → /server01/.
    location = /server01 {
        return 301 /server01/;
    }

    # Strip do prefixo: /server01/<resto> → /<resto> em 127.0.0.1:8080.
    location /server01/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    # Nada fora de /server01/ é servido por este host.
    location / {
        return 404;
    }
}
