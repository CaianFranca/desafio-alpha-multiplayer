# nginx.prod.conf — Flicker of Sanity em produção (nativo, sem Docker).
# Instalado em /etc/nginx/sites-available/flicker pelo deploy-server.sh.
# Único serviço exposto: listen 8080. Apps/PG/redis ficam em 127.0.0.1.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# HSTS condicional (map compartilhado com nginx.conf — ponto único em
# hsts-map.snippet). Incluído em contexto http.
include /etc/nginx/conf.d/hsts-map.snippet;

upstream lobby_server {
    server 127.0.0.1:3001;
}

upstream game_servers {
    server 127.0.0.1:1234;
    # futuras instâncias: não adicionar server estático aqui; descoberta via registro Redis com heartbeat/lease (ADR-0003)
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    # Docroot publicado pelo deploy-server.sh como symlink para a release:
    # /var/www/html -> /opt/flicker/releases/<sha>/frontend/dist.
    root /var/www/html;
    index index.html;

    # Headers base (herdados por /api/, /ws/* e /internal/, sem CSP —
    # intencional, CSP só em conteúdo estático).
    include /etc/nginx/conf.d/security-headers.snippet;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    # media/ no dev é bind-mount do compose; no prod o tarball copia a mídia
    # para dentro do dist (frontend/dist/media), servido sob o docroot.
    location /media/ {
        alias /var/www/html/media/;
        try_files $uri =404;
        # add_header não herda do server quando o location define o seu:
        # snippet estático (base + CSP, só em conteúdo estático).
        include /etc/nginx/conf.d/security-headers-static.snippet;
    }

    location = /api {
        return 301 /api/;
    }

    # Bloqueio de rotas internas (Service Tokens / Bots) para clientes externos
    location /internal/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://lobby_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A borda (nginx.edge.conf) já terminou o TLS: repassa o valor
        # recebido em vez de $scheme, que aqui seria http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /ws/lobby {
        proxy_pass http://lobby_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ~ ^/ws/game/ {
        proxy_pass http://game_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # add_header não herda do server quando o location define o seu:
        # snippet estático (base + CSP, só em conteúdo estático).
        include /etc/nginx/conf.d/security-headers-static.snippet;
    }
}
