# nginx.prod.conf — Flicker of Sanity em produção (nativo, sem Docker).
# Instalado em /etc/nginx/sites-available/flicker pelo deploy-server.sh.
# Único serviço exposto: listen 8080. Apps/PG/redis ficam em 127.0.0.1.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# HSTS condicional: emitido só quando o TLS foi terminado no proxy da borda
# (X-Forwarded-Proto: https). Valor vazio = header omitido em HTTP puro.
# max-age de 30 dias como ramp-up no host compartilhado lab.alphaedtech.org.br;
# alvo final OWASP após período estável: max-age=31536000.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https "max-age=2592000";
}

upstream lobby_server {
    server 127.0.0.1:3001;
}

upstream game_servers {
    server 127.0.0.1:1234;
    # futuras instâncias: não adicionar server estático aqui; descoberta via registro Redis com heartbeat/lease (ADR-0003)
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    # Docroot publicado pelo deploy-server.sh como symlink para a release:
    # /var/www/html -> /opt/flicker/releases/<sha>/frontend/dist.
    root /var/www/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    # media/ no dev é bind-mount do compose; no prod o tarball copia a mídia
    # para dentro do dist (frontend/dist/media), servido sob o docroot.
    location /media/ {
        alias /var/www/html/media/;
        try_files $uri =404;
        # add_header não herda do server quando o location define o seu:
        # repetir os headers do server + CSP (só em conteúdo estático).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' ws: wss:;" always;
    }

    location = /api {
        return 301 /api/;
    }

    # Bloqueio de rotas internas (Service Tokens / Bots) para clientes externos
    location /internal/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://lobby_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A borda (nginx.edge.conf) já terminou o TLS: repassa o valor
        # recebido em vez de $scheme, que aqui seria http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /ws/lobby {
        proxy_pass http://lobby_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ~ ^/ws/game/ {
        proxy_pass http://game_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # add_header não herda do server quando o location define o seu:
        # repetir os headers do server + CSP (só em conteúdo estático).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' ws: wss:;" always;
    }
}
