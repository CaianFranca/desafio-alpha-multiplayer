# nginx.dev.conf — Flicker of Sanity em modo dev (hot-reload).
# Espelho de nginx.conf, exceto o `location /`: em vez de servir o build
# estático, proxya para o Vite dev server (frontend-dev:5173), incluindo o
# upgrade de WebSocket que o HMR usa (mesmo padrão Upgrade/Connection das
# locations /ws/*). Todo o resto — /api/, /ws/lobby, /ws/game/, /media/ —
# é idêntico ao de produção local, então os testes manuais exercem o
# routing real. Usado via docker-compose.dev.yml (montado sobre
# /etc/nginx/conf.d/default.conf); nginx.conf continua sendo o contrato
# do modo full.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream lobby_server {
    server lobby-server:3001;
}

upstream game_servers {
    server game-server:1234;
    # futuras instâncias: não adicionar server estático aqui; descoberta via registro Redis com heartbeat/lease (ADR-0003)
}

upstream frontend_dev {
    server frontend-dev:5173;
}

server {
    listen 80;
    listen [::]:80;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    location /media/ {
        alias /usr/share/nginx/html/media/;
        try_files $uri =404;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://lobby_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/lobby {
        proxy_pass http://lobby_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ~ ^/ws/game/ {
        proxy_pass http://game_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        # HMR do Vite abre WebSocket contra o host da página (:8080);
        # sem repassar o upgrade, o HMR cai em polling/reload cheio.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
